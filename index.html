<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess AI Arena</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

<style>
body {
    background: #0f172a;
    color: white;
    font-family: sans-serif;
    text-align: center;
}

#board {
    width: 90vw;
    max-width: 400px;
    margin: 20px auto;
    border-radius: 16px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

.slider {
    width: 80%;
}

.card {
    background: #1e293b;
    padding: 15px;
    margin: 10px auto;
    border-radius: 12px;
    width: 90%;
    max-width: 400px;
}

.glow {
    animation: glow 0.5s;
}

@keyframes glow {
    0% { box-shadow: 0 0 0px gold; }
    100% { box-shadow: 0 0 20px gold; }
}

.blunder {
    animation: shake 0.3s;
}

@keyframes shake {
    0% { transform: translateX(0px); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0px); }
}

</style>
</head>

<body>

<h2>♟️ Chess AI Arena</h2>

<div id="board"></div>

<div class="card">
    <h3>ELO: <span id="eloValue">800</span></h3>
    <input type="range" min="250" max="3050" value="800" id="eloSlider" class="slider">
</div>

<div class="card">
    <h3>Top Moves</h3>
    <div id="moves"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>
const game = new Chess();

let board = Chessboard('board', {
    draggable: true,
    position: 'start',
    onDrop: onDrop
});

// STOCKFISH
const stockfish = new Worker("https://cdn.jsdelivr.net/npm/stockfish/stockfish.js");
stockfish.postMessage("uci");

let currentSettings = getBotSettings(800);

document.getElementById("eloSlider").oninput = (e) => {
    const elo = parseInt(e.target.value);
    document.getElementById("eloValue").innerText = elo;
    currentSettings = getBotSettings(elo);
};

// ELO SETTINGS
function getBotSettings(elo) {
    elo = Math.max(250, Math.min(3050, elo));
    const t = (elo - 250) / (3050 - 250);

    return {
        depth: Math.floor(1 + t * 29),
        multipv: Math.floor(12 - t * 11),
        randomness: 1 - t
    };
}

// PLAYER MOVE
function onDrop(source, target) {
    const move = game.move({
        from: source,
        to: target,
        promotion: 'q'
    });

    if (move === null) return 'snapback';

    setTimeout(makeBotMove, 200);
}

// BOT MOVE
function makeBotMove() {
    getBestMoves(game.fen(), currentSettings).then(moves => {

        displayMoves(moves);

        const chosen = pickMove(moves, currentSettings);

        game.move({
            from: chosen.move.substring(0,2),
            to: chosen.move.substring(2,4),
            promotion: 'q'
        });

        board.position(game.fen());

        animateMove(chosen.rank);
    });
}

// GET MULTIPV MOVES
function getBestMoves(fen, settings) {
    return new Promise(resolve => {
        let moves = [];

        stockfish.onmessage = function(e) {
            let line = e.data;

            if (line.includes("multipv")) {
                let match = line.match(/multipv (\d+) .* pv ([a-h][1-8][a-h][1-8])/);
                if (match) {
                    moves.push({
                        rank: parseInt(match[1]),
                        move: match[2]
                    });
                }
            }

            if (line.includes("bestmove")) {
                moves.sort((a,b)=>a.rank-b.rank);
                resolve(moves);
            }
        };

        stockfish.postMessage(`position fen ${fen}`);
        stockfish.postMessage(`setoption name MultiPV value ${settings.multipv}`);
        stockfish.postMessage(`go depth ${settings.depth}`);
    });
}

// PICK MOVE
function pickMove(moves, settings) {
    if (settings.multipv === 1) return moves[0];

    let total = 0;
    let weights = moves.map((m,i)=>{
        let w = Math.pow(1/(i+1), 1 + settings.randomness*3);
        total += w;
        return w;
    });

    let r = Math.random()*total;

    for (let i=0;i<moves.length;i++){
        if ((r-=weights[i])<=0) return moves[i];
    }

    return moves[0];
}

// DISPLAY MOVES
function displayMoves(moves) {
    let html = "";
    moves.forEach(m=>{
        html += `<div>#${m.rank}: ${m.move}</div>`;
    });
    document.getElementById("moves").innerHTML = html;
}

// ANIMATION
function animateMove(rank) {
    const boardEl = document.getElementById("board");

    boardEl.classList.remove("glow","blunder");

    if (rank === 1) {
        boardEl.classList.add("glow");
    } else if (rank > 5) {
        boardEl.classList.add("blunder");
    }
}

</script>

</body>
</html>

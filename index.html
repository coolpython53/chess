<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pixel Grid - Hard Lock</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; }
        #header { background: #333; height: 60px; display: flex; align-items: center; justify-content: center; gap: 15px; z-index: 10; }
        #view-port { width: 100vw; height: calc(100vh - 60px); overflow: auto; background: #222; }
        canvas { background: #ffffff; image-rendering: pixelated; cursor: crosshair; display: block; margin: 0 auto; border: 2px solid #000; }
        .stat { padding: 5px 12px; border-radius: 4px; background: #444; font-size: 14px; min-width: 80px; text-align: center; }
        #status.ready { color: #4caf50; font-weight: bold; }
        #status.wait { color: #ff5252; font-weight: bold; }
        #status.syncing { color: #2196f3; }
        input[type="color"] { border: none; width: 40px; height: 40px; cursor: pointer; background: none; }
    </style>
</head>
<body>

<div id="header">
    <input type="color" id="colorPicker" value="#000000">
    <div id="status" class="wait">Starting...</div>
    <div id="timer" class="stat">--</div>
    <div id="coords" class="stat">X: 0, Y: 0</div>
    <button onclick="loadPixels()" style="cursor:pointer; padding:8px; border-radius:4px; border:none; background:#666; color:white;">Sync</button>
</div>

<div id="view-port">
    <canvas id="mainCanvas" width="1000" height="1000" style="width:2000px; height:2000px;"></canvas>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbxUhcHKbXAvsP_KhDTDc9AOWgaifOz6NTS0GGbTIG-9vBIcN1z3k7Hf5E9eivHMfIiutA/exec";
    const TOKEN = "1341323124312432141342312431427646";
    const COOLDOWN_MS = 40000; // 40 Seconds
    
    const cv = document.getElementById('mainCanvas');
    const ctx = cv.getContext('2d');
    const statusEl = document.getElementById('status');
    const timerEl = document.getElementById('timer');
    
    let isFetching = false;

    // --- 1. THE ONLY SOURCE OF TRUTH: THE CLOCK ---
    function getCooldownRemaining() {
        const last = localStorage.getItem('px_time');
        if (!last) return 0;
        const now = Date.now();
        const diff = now - parseInt(last);
        return Math.max(0, COOLDOWN_MS - diff);
    }

    // --- 2. UPDATE THE UI (RUNS CONSTANTLY) ---
    function refreshUI() {
        const remainingMs = getCooldownRemaining();
        
        if (remainingMs > 0) {
            statusEl.innerText = "Wait";
            statusEl.className = "wait";
            timerEl.innerText = Math.ceil(remainingMs / 1000) + "s";
        } else if (isFetching) {
            statusEl.innerText = "Syncing...";
            statusEl.className = "syncing";
            timerEl.innerText = "Ready";
        } else {
            statusEl.innerText = "Ready";
            statusEl.className = "ready";
            timerEl.innerText = "Ready";
        }
    }

    // --- 3. DATA LOADING ---
    async function loadPixels() {
        if (isFetching) return;
        isFetching = true;
        refreshUI();

        try {
            const res = await fetch(API + "?t=" + Date.now());
            const data = await res.json();
            
            // Clear and redraw
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, 1000, 1000);
            
            if (data && data.length > 0) {
                data.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(parseInt(p.x), parseInt(p.y), 1, 1);
                });
            }
        } catch (e) { console.error("Sync error", e); }
        
        isFetching = false;
        refreshUI();
    }

    // --- 4. THE CLICK (WITH HARD TIMESTAMP LOCK) ---
    cv.addEventListener('mousedown', (e) => {
        // RE-CALCULATE CLOCK IMMEDIATELY ON CLICK
        if (getCooldownRemaining() > 0) {
            console.log("Blocked: Timer still running");
            return; // EXIT IMMEDIATELY
        }

        const rect = cv.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) * (cv.width / rect.width));
        const y = Math.floor((e.clientY - rect.top) * (cv.height / rect.height));
        const color = document.getElementById('colorPicker').value;

        // Draw Locally
        ctx.fillStyle = color;
        ctx.fillRect(x, y, 1, 1);

        // LOCK THE CLOCK
        localStorage.setItem('px_time', Date.now().toString());
        refreshUI();

        // Send to Server
        fetch(API, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({ x, y, color, token: TOKEN })
        });
    });

    // Handle Coordinate Display
    cv.addEventListener('mousemove', (e) => {
        const rect = cv.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) * (cv.width / rect.width));
        const y = Math.floor((e.clientY - rect.top) * (cv.height / rect.height));
        document.getElementById('coords').innerText = `X: ${x}, Y: ${y}`;
    });

    // --- 5. INITIALIZE ---
    window.onload = () => {
        loadPixels();
        // UI refreshes every 100ms for a smooth timer
        setInterval(refreshUI, 100); 
        // Background sync every 30 seconds
        setInterval(loadPixels, 30000); 
    };

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockfish Mastery - Pro Analysis</title>
    <!-- Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .level-card.locked { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }
        .level-card.active { border: 2px solid #3b82f6; background: rgba(59, 130, 246, 0.3); }
        #board-container { display: flex; gap: 15px; width: 100%; max-width: 580px; margin: 0 auto; align-items: stretch; }
        #board { flex-grow: 1; }
        
        #eval-bar-container {
            width: 32px;
            background: #000000;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
            position: relative;
            border: 2px solid #0f172a;
        }
        #eval-bar-white { 
            background: #ffffff;
            width: 100%; 
            height: 50%; 
            transition: height 0.6s cubic-bezier(0.23, 1, 0.32, 1); 
        }
        #eval-text {
            position: absolute; 
            width: 100%; 
            text-align: center; 
            font-size: 10px;
            font-weight: 900; 
            z-index: 10; 
            left: 0; 
            pointer-events: none;
        }
        #eval-text.on-white { bottom: 6px; color: #000; }
        #eval-text.on-black { top: 6px; color: #fff; }

        .chessboard-63fde { border: 4px solid #334155 !important; border-radius: 4px; overflow: hidden; }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        .theme-forest .white-1e1d7 { background-color: #edead0 !important; }
        .theme-forest .black-3c85d { background-color: #6c9463 !important; }
        .theme-ocean .white-1e1d7 { background-color: #dee3e6 !important; }
        .theme-ocean .black-3c85d { background-color: #8ca2ad !important; }
        .theme-dark .white-1e1d7 { background-color: #9e9e9e !important; }
        .theme-dark .black-3c85d { background-color: #424242 !important; }

        .move-item { cursor: pointer; padding: 4px; border-radius: 4px; transition: all 0.2s; }
        .move-item:hover { background: rgba(255,255,255,0.1); }
        .move-item.active { background: #3b82f6; color: white; font-weight: bold; }

        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #3b82f6;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 1000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        .hint-glow { 
            animation: hint-glow-anim 2s infinite alternate; 
            border: 1px solid rgba(59, 130, 246, 0.5);
        }
        @keyframes hint-glow-anim {
            from { box-shadow: 0 0 5px rgba(59, 130, 246, 0.2); }
            to { box-shadow: 0 0 15px rgba(59, 130, 246, 0.6); }
        }

        .thinking-loader {
            height: 2px;
            width: 0%;
            background: #3b82f6;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col lg:flex-row p-4 gap-4 font-sans overflow-x-hidden">

    <div id="toast">Message</div>

    <!-- Left Sidebar -->
    <div class="w-full lg:w-80 flex flex-col gap-4 bg-slate-800 p-4 rounded-xl shadow-2xl h-[92vh]">
        <div class="flex flex-col gap-2 border-b border-slate-700 pb-4">
            <div class="flex justify-between items-center mb-1">
                <h1 class="text-lg font-bold">Stockfish Mastery</h1>
                <div class="bg-amber-500/20 text-amber-400 px-2 py-1 rounded text-xs font-mono flex items-center gap-1">
                    🪙 <span id="coin-display">0</span>
                </div>
            </div>
            <div class="flex gap-2">
                <button id="export-btn" class="flex-1 py-1.5 text-[10px] bg-slate-700 hover:bg-slate-600 rounded transition uppercase font-bold tracking-wider">Export</button>
                <button id="import-btn" class="flex-1 py-1.5 text-[10px] bg-slate-700 hover:bg-slate-600 rounded transition uppercase font-bold tracking-wider">Import</button>
            </div>
        </div>

        <div class="flex border-b border-slate-700">
            <button onclick="switchTab('levels')" id="tab-levels" class="flex-1 py-2 text-xs font-bold border-b-2 border-blue-500 text-blue-400">Levels</button>
            <button onclick="switchTab('shop')" id="tab-shop" class="flex-1 py-2 text-xs font-bold border-b-2 border-transparent text-slate-400">Shop</button>
        </div>

        <div id="content-levels" class="flex-col gap-2 overflow-y-auto flex-grow pr-1 custom-scroll">
            <div id="level-list" class="flex flex-col gap-1.5"></div>
        </div>

        <div id="content-shop" class="hidden flex-col gap-4 overflow-y-auto flex-grow pr-1 custom-scroll">
            <div class="text-[10px] uppercase text-slate-500 font-bold">Board Themes</div>
            <div id="board-shop" class="grid grid-cols-2 gap-2"></div>
            <div class="text-[10px] uppercase text-slate-500 font-bold mt-2">Piece Skins</div>
            <div id="piece-shop" class="grid grid-cols-2 gap-2"></div>
        </div>
    </div>

    <!-- Middle: Game Board -->
    <div class="flex-1 flex flex-col items-center justify-start gap-4">
        <div class="bg-slate-800 p-4 lg:p-6 rounded-2xl shadow-2xl w-full max-w-2xl border border-slate-700 relative">
            
            <div id="resume-overlay" class="hidden absolute top-20 left-0 right-0 z-20 flex justify-center pointer-events-none">
                <button onclick="resumeToLive()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-full font-bold text-xs shadow-2xl pointer-events-auto flex items-center gap-2 transform transition hover:scale-105 active:scale-95">
                    BACK TO LIVE
                </button>
            </div>

            <div class="flex justify-between items-start mb-4">
                <div>
                    <h2 id="current-level-title" class="text-md font-bold text-blue-400">Level 0</h2>
                    <p id="player-side-info" class="text-[10px] font-bold uppercase tracking-widest text-slate-400">White</p>
                </div>
                <div id="game-status" class="text-[10px] px-3 py-1 bg-slate-700 rounded-full font-bold uppercase">Ready</div>
            </div>

            <div id="board-container">
                <div id="eval-bar-container">
                    <div id="eval-text" class="on-black">0.0</div>
                    <div id="eval-bar-white"></div>
                </div>
                <div id="board"></div>
            </div>

            <!-- Hint Box with Thought Stream -->
            <div id="hint-box" class="mt-4 w-full bg-slate-900 border border-slate-700 p-3 rounded-lg flex flex-col gap-2 transition-all duration-300">
                <div class="flex justify-between items-center px-1">
                    <p id="hint-label" class="text-[9px] uppercase text-slate-500 font-bold tracking-widest">Engine Analysis</p>
                    <p id="depth-text" class="text-[9px] text-slate-600 font-mono"></p>
                </div>

                <div class="flex flex-col items-center py-2">
                    <p id="hint-text" class="text-2xl font-mono font-black text-slate-700 tracking-widest italic transition-colors">READY</p>
                    <div id="thought-stream" class="text-[10px] text-slate-500 font-mono mt-1 h-4 overflow-hidden truncate max-w-full italic">Waiting for request...</div>
                </div>

                <div class="w-full bg-slate-800 rounded-full h-[2px] overflow-hidden">
                    <div id="thinking-progress" class="thinking-loader"></div>
                </div>

                <button id="get-hint-btn" class="mt-1 w-full py-2 bg-blue-600/10 hover:bg-blue-600/30 border border-blue-500/30 rounded text-[10px] font-bold uppercase tracking-wider text-blue-400 transition-all flex items-center justify-center gap-2">
                    <svg id="hint-icon" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    Request Hint (Depth 18)
                </button>
            </div>

            <div class="mt-4 flex flex-wrap gap-2 justify-center">
                <button id="reset-btn" class="flex-1 min-w-[120px] py-3 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold transition">NEW GAME</button>
                <button id="copy-moves-btn" class="flex-1 min-w-[120px] py-3 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-bold transition shadow-lg">COPY PGN</button>
            </div>
        </div>
    </div>

    <!-- Right Sidebar -->
    <div class="w-full lg:w-72 flex flex-col gap-4 bg-slate-800 p-4 rounded-xl shadow-2xl h-[92vh] border border-slate-700">
        <h3 class="text-xs font-bold uppercase text-slate-400">Move History</h3>
        <div id="move-history-list" class="flex-grow overflow-y-auto custom-scroll text-sm font-mono grid grid-cols-2 gap-x-2 gap-y-1 content-start bg-slate-900/50 p-2 rounded-lg border border-slate-700"></div>
    </div>

    <!-- Promotion & Game Over Modals remain similar -->
    <div id="promo-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[60]"><div class="bg-slate-800 p-6 rounded-2xl border border-slate-600 shadow-2xl text-center"><h3 class="text-lg font-bold mb-4">Choose Promotion</h3><div class="flex gap-4"><div onclick="selectPromotion('q')" class="promo-choice p-2 rounded bg-slate-700"><img id="promo-q" src="" class="w-12 h-12"></div><div onclick="selectPromotion('r')" class="promo-choice p-2 rounded bg-slate-700"><img id="promo-r" src="" class="w-12 h-12"></div><div onclick="selectPromotion('b')" class="promo-choice p-2 rounded bg-slate-700"><img id="promo-b" src="" class="w-12 h-12"></div><div onclick="selectPromotion('n')" class="promo-choice p-2 rounded bg-slate-700"><img id="promo-n" src="" class="w-12 h-12"></div></div></div></div>
    <div id="game-over-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4"><div class="bg-slate-800 p-8 rounded-2xl text-center max-w-sm border border-slate-600 shadow-2xl"><h2 id="modal-title" class="text-3xl font-bold mb-2">Game Over</h2><div id="modal-reward" class="text-amber-400 font-bold text-xl mb-4"></div><button onclick="$('#game-over-modal').addClass('hidden'); resetGame();" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold transition">New Match</button></div></div>

    <script>
        const STOCKFISH_URL = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
        let liveGame = new Chess();
        let board = null;
        let stockfish = null;
        let moveHistory = []; 
        let historyIndex = -1; 
        let playerColor = 'w';
        let isCalculatingHint = false;
        const TARGET_DEPTH = 18;

        const STORAGE_KEY = 'sf_mastery_v6_thoughts';
        let state = { coins: 0, unlocked: 0, skin: 'wikipedia', board: 'classic' };

        function loadFromLocal() { const saved = localStorage.getItem(STORAGE_KEY); if (saved) { try { state = JSON.parse(saved); } catch(e) {} } }
        function saveToLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); $('#coin-display').text(Math.floor(state.coins).toLocaleString()); }

        const pieceSkins = [{ id: 'wikipedia', url: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' }];
        const boardThemes = [{ id: 'classic', class: '' }];

        async function initEngine() {
            if (stockfish) stockfish.terminate();
            const blob = new Blob([`importScripts("${STOCKFISH_URL}");`], { type: 'application/javascript' });
            stockfish = new Worker(URL.createObjectURL(blob));
            
            stockfish.onmessage = (e) => {
                const line = e.data;
                
                // Parsing UCI info for live thoughts
                if (line.includes('info depth')) {
                    const depthMatch = line.match(/depth (\d+)/);
                    const pvMatch = line.match(/ pv (.+)/);
                    const cpMatch = line.match(/score cp (-?\d+)/);
                    
                    if (depthMatch && isCalculatingHint) {
                        const d = parseInt(depthMatch[1]);
                        $('#depth-text').text(`D: ${d}/${TARGET_DEPTH}`);
                        $('#thinking-progress').css('width', `${(d/TARGET_DEPTH) * 100}%`);
                        
                        if (pvMatch) {
                            const pv = pvMatch[1].split(' ').slice(0, 5).join(' ');
                            $('#thought-stream').text(`Thinking: ${pv}...`);
                            
                            // Live best move preview
                            const firstMove = pvMatch[1].split(' ')[0];
                            const temp = new Chess(liveGame.fen());
                            const m = temp.move(firstMove, {sloppy:true});
                            if (m) $('#hint-text').text(m.san).removeClass('text-slate-700').addClass('text-blue-500/60');
                        }
                    }

                    if (cpMatch && !isCalculatingHint) {
                        updateEvalBar(parseInt(cpMatch[1]) * (liveGame.turn() === 'b' ? -1 : 1));
                    }
                }

                if (line.startsWith('bestmove')) {
                    const moveStr = line.split(' ')[1];
                    if (isCalculatingHint) {
                        const moveObj = new Chess(liveGame.fen()).move(moveStr, { sloppy: true });
                        finishHint(moveObj ? moveObj.san : moveStr);
                    } else if (liveGame.turn() !== playerColor && !liveGame.game_over()) {
                        const move = liveGame.move(moveStr, { sloppy: true });
                        if (move) { recordMove(move); updateStatus(); }
                    }
                }
            };
            stockfish.postMessage('uci');
            stockfish.postMessage('isready');
            const elo = 100 + (state.unlocked * 145);
            stockfish.postMessage(`setoption name UCI_LimitStrength value true`);
            stockfish.postMessage(`setoption name UCI_Elo value ${elo}`);
        }

        function finishHint(san) {
            isCalculatingHint = false;
            $('#hint-text').text(san).removeClass('text-blue-500/60 italic').addClass('text-blue-400 font-black');
            $('#hint-box').addClass('hint-glow border-blue-500/50');
            $('#thought-stream').text('Analysis complete.');
            $('#thinking-progress').css('width', '100%');
            $('#get-hint-btn').text('Request Hint (Depth 18)').removeClass('opacity-50 pointer-events-none');
        }

        function requestManualHint() {
            if (liveGame.game_over() || liveGame.turn() !== playerColor || historyIndex !== moveHistory.length - 1) return;
            isCalculatingHint = true;
            $('#hint-text').text('...').addClass('text-slate-700 italic').removeClass('text-blue-400');
            $('#get-hint-btn').text('Analyzing Line...').addClass('opacity-50 pointer-events-none');
            $('#thinking-progress').css('width', '0%');
            stockfish.postMessage('stop');
            stockfish.postMessage(`position fen ${liveGame.fen()}`);
            stockfish.postMessage(`go depth ${TARGET_DEPTH}`);
        }

        function updateEvalBar(score) {
            const val = Math.max(-10, Math.min(10, score / 100));
            const pct = 50 + (val * 5);
            $('#eval-bar-white').css('height', `${pct}%`);
            $('#eval-text').text((score/100).toFixed(1)).toggleClass('on-white', pct > 50).toggleClass('on-black', pct <= 50);
        }

        function recordMove(move) {
            moveHistory.push({ fen: liveGame.fen(), san: move.san });
            historyIndex = moveHistory.length - 1;
            if (historyIndex === moveHistory.length - 1) board.position(liveGame.fen());
            renderHistory();
            resetHintBox();
        }

        function resetHintBox() {
            isCalculatingHint = false;
            $('#hint-text').text('READY').addClass('text-slate-700 italic').removeClass('text-blue-400 font-black');
            $('#hint-box').removeClass('hint-glow border-blue-500/50');
            $('#thought-stream').text(liveGame.game_over() ? 'Game finished.' : 'Waiting for request...');
            $('#depth-text').text('');
            $('#thinking-progress').css('width', '0%');
        }

        function updateStatus() {
            $('#game-status').text(liveGame.in_checkmate() ? 'Checkmate' : liveGame.in_draw() ? 'Draw' : (liveGame.turn() === 'w' ? "White's Turn" : "Black's Turn"));
            if (liveGame.game_over()) handleGameOver();
            else if (liveGame.turn() === playerColor) $('#get-hint-btn').removeClass('opacity-50 pointer-events-none');
            else {
                $('#get-hint-btn').addClass('opacity-50 pointer-events-none');
                $('#hint-text').text('OPPONENT THINKING');
                $('#thought-stream').text('Stockfish is calculating response...');
            }
        }

        function onDrop(source, target) {
            const move = liveGame.move({ from: source, to: target, promotion: 'q' });
            if (!move) return 'snapback';
            recordMove(move);
            updateStatus();
            if (!liveGame.game_over()) setTimeout(() => {
                stockfish.postMessage(`position fen ${liveGame.fen()}`);
                stockfish.postMessage(`go movetime ${200 + (state.unlocked * 50)}`);
            }, 250);
        }

        function renderHistory() {
            const list = $('#move-history-list').empty();
            moveHistory.forEach((m, i) => list.append(`<div class="move-item ${i === historyIndex ? 'active' : ''}">${m.san}</div>`));
            const c = document.getElementById('move-history-list'); c.scrollTop = c.scrollHeight;
        }

        function handleGameOver() {
            $('#game-over-modal').removeClass('hidden');
            $('#modal-title').text(liveGame.in_checkmate() ? 'Checkmate!' : 'Draw Game');
            saveToLocal();
        }

        async function resetGame() {
            liveGame = new Chess(); moveHistory = []; historyIndex = -1;
            playerColor = Math.random() < 0.5 ? 'w' : 'b';
            board.orientation(playerColor === 'w' ? 'white' : 'black');
            board.start();
            renderHistory(); updateEvalBar(0); resetHintBox();
            await initEngine(); updateStatus();
            if (playerColor === 'b') {
                stockfish.postMessage(`position fen ${liveGame.fen()}`);
                stockfish.postMessage(`go movetime 500`);
            }
        }

        $(document).ready(async () => {
            loadFromLocal(); saveToLocal();
            board = Chessboard('board', {
                draggable: true, position: 'start',
                onDragStart: (s, p) => (historyIndex === moveHistory.length-1 && !liveGame.game_over() && liveGame.turn() === playerColor),
                onDrop: onDrop, onSnapEnd: () => board.position(liveGame.fen()),
                pieceTheme: pieceSkins[0].url
            });
            $('#get-hint-btn').click(requestManualHint);
            $('#reset-btn').click(resetGame);
            await resetGame();
        });

        function switchTab(t) { /* Simple tab toggle logic */ }
        function initLevels() { /* Level list logic */ }
    </script>
</body>
</html>

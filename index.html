<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockfish Mastery - Unlock the Grandmaster</title>
    <!-- Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .level-card.locked { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }
        .level-card.active { border: 2px solid #3b82f6; background: rgba(59, 130, 246, 0.2); }
        #board-container { display: flex; gap: 15px; width: 100%; max-width: 580px; margin: 0 auto; align-items: stretch; }
        #board { flex-grow: 1; }
        
        #eval-bar-container {
            width: 32px; /* Increased width */
            background: #000000; /* Solid Black background for the black side */
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse; /* White grows from bottom */
            position: relative;
            border: 2px solid #0f172a;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        #eval-bar-white { 
            background: #ffffff; /* Pure white for contrast */
            width: 100%; 
            height: 50%; 
            transition: height 0.6s cubic-bezier(0.23, 1, 0.32, 1); 
        }
        #eval-text {
            position: absolute; 
            width: 100%; 
            text-align: center; 
            font-size: 10px; /* Slightly larger text */
            font-weight: 800; 
            z-index: 10; 
            left: 0; 
            pointer-events: none;
            letter-spacing: -0.5px;
        }
        /* Position logic for text to stay visible */
        #eval-text.on-white { bottom: 8px; color: #000; }
        #eval-text.on-black { top: 8px; color: #fff; }

        .chessboard-63fde { border: 4px solid #334155 !important; border-radius: 4px; overflow: hidden; }
        #level-list::-webkit-scrollbar { width: 4px; }
        #level-list::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        .theme-forest .white-1e1d7 { background-color: #edead0 !important; }
        .theme-forest .black-3c85d { background-color: #6c9463 !important; }
        .theme-ocean .white-1e1d7 { background-color: #dee3e6 !important; }
        .theme-ocean .black-3c85d { background-color: #8ca2ad !important; }
        .theme-dark .white-1e1d7 { background-color: #9e9e9e !important; }
        .theme-dark .black-3c85d { background-color: #424242 !important; }

        .captured-piece { width: 22px; height: 22px; background-size: contain; background-repeat: no-repeat; display: inline-block; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col md:flex-row p-4 gap-6 font-sans">

    <!-- Sidebar -->
    <div class="w-full md:w-80 flex flex-col gap-4 bg-slate-800 p-4 rounded-xl shadow-2xl h-[90vh]">
        <div class="flex flex-col gap-2 border-b border-slate-700 pb-4">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-xl font-bold">Stockfish Mastery</h1>
                <div class="bg-amber-500/20 text-amber-400 px-2 py-1 rounded text-sm font-mono flex items-center gap-1">
                    🪙 <span id="coin-display">0</span>
                </div>
            </div>
            <div class="flex gap-2">
                <button id="save-btn" class="flex-1 py-1 text-[10px] bg-slate-700 hover:bg-slate-600 rounded transition uppercase font-bold">Copy Save</button>
                <button id="load-btn" class="flex-1 py-1 text-[10px] bg-slate-700 hover:bg-slate-600 rounded transition uppercase font-bold">Load Save</button>
            </div>
        </div>

        <div id="rebirth-container" class="hidden">
            <button id="rebirth-btn" class="w-full py-3 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 rounded-lg font-bold text-sm shadow-lg transform transition active:scale-95 flex flex-col items-center">
                <span>REBIRTH NOW</span>
                <span id="rebirth-desc" class="text-[10px] opacity-80 font-normal">Next Multiplier: 2x</span>
            </button>
        </div>

        <div class="flex border-b border-slate-700">
            <button onclick="switchTab('levels')" id="tab-levels" class="flex-1 py-2 text-sm font-bold border-b-2 border-blue-500 text-blue-400">Levels</button>
            <button onclick="switchTab('shop')" id="tab-shop" class="flex-1 py-2 text-sm font-bold border-b-2 border-transparent text-slate-400">Shop</button>
        </div>

        <div id="content-levels" class="flex-col gap-2 overflow-y-auto flex-grow pr-1">
            <div id="level-list" class="flex flex-col gap-2"></div>
        </div>

        <div id="content-shop" class="hidden flex-col gap-4 overflow-y-auto flex-grow pr-1">
            <div class="mt-2 p-3 bg-slate-900/50 rounded-lg border border-slate-700">
                <p class="text-[10px] text-slate-400 uppercase font-bold">Current Multiplier</p>
                <p id="multi-display" class="text-xl font-bold text-blue-400">1x Earnings</p>
            </div>
            <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase mb-2">Board Themes</h3>
                <div class="grid grid-cols-2 gap-2" id="board-shop"></div>
            </div>
            <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase mb-2">Piece Skins</h3>
                <div class="grid grid-cols-2 gap-2" id="piece-shop"></div>
            </div>
            <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase mb-2">Sound Effects</h3>
                <div class="grid grid-cols-2 gap-2" id="sound-shop"></div>
            </div>
        </div>
    </div>

    <!-- Main Game -->
    <div class="flex-1 flex flex-col items-center justify-center gap-4">
        <div class="bg-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-3xl">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h2 id="current-level-title" class="text-lg font-bold text-blue-400">Level 0: Total Beginner</h2>
                    <p id="level-desc" class="text-xs text-slate-400 mb-1">ELO: 500</p>
                    <div id="level-reward-tag" class="inline-block text-[10px] px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                        Unlocked Reward: Next Level
                    </div>
                </div>
                <div class="text-right">
                    <div id="game-status" class="text-xs px-3 py-1 bg-slate-700 rounded-full inline-block">Ready</div>
                    <p id="player-side-info" class="text-[10px] font-bold mt-2 uppercase tracking-widest text-slate-400">Playing as White</p>
                </div>
            </div>

            <!-- Captured Pieces -->
            <div id="captured-container" class="flex justify-between px-2 mb-2 min-h-[30px] items-center bg-slate-900/40 rounded-lg p-1 border border-slate-700/50">
                <div id="captures-white" class="flex items-center gap-0.5 opacity-80"></div>
                <div id="material-advantage" class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">Even</div>
                <div id="captures-black" class="flex items-center gap-0.5 opacity-80"></div>
            </div>

            <div id="board-container">
                <div id="eval-bar-container">
                    <div id="eval-text" class="on-black">0.0</div>
                    <div id="eval-bar-white"></div>
                </div>
                <div id="board"></div>
            </div>

            <div class="mt-6 flex gap-4 justify-center">
                <button id="reset-btn" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold transition">Reset Match</button>
                <button id="undo-btn" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold transition">Undo</button>
            </div>
        </div>
    </div>

    <!-- Modals & Overlays -->
    <div id="game-over-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 p-8 rounded-2xl text-center max-w-sm border border-slate-600 shadow-2xl">
            <h2 id="modal-title" class="text-3xl font-bold mb-2">You Won!</h2>
            <div id="modal-reward" class="text-amber-400 font-bold text-xl mb-4"></div>
            <p id="modal-msg" class="text-slate-300 mb-6"></p>
            <button onclick="closeModal()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold transition">Continue</button>
        </div>
    </div>

    <div id="promotion-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[60] p-4">
        <div class="bg-slate-800 p-6 rounded-2xl text-center max-w-xs border border-blue-500 shadow-2xl">
            <h2 class="text-xl font-bold mb-4">Promote Pawn</h2>
            <div class="grid grid-cols-2 gap-3" id="promotion-options"></div>
        </div>
    </div>

    <div id="load-prompt-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 p-8 rounded-2xl w-full max-w-md border border-slate-600 shadow-2xl">
            <h2 class="text-2xl font-bold mb-4">Paste Save Code</h2>
            <textarea id="save-code-input" class="w-full h-32 bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs mb-4 focus:outline-none focus:border-blue-500 font-mono text-slate-300"></textarea>
            <div class="flex gap-3">
                <button onclick="$('#load-prompt-modal').addClass('hidden')" class="flex-1 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold transition">Cancel</button>
                <button id="confirm-load-btn" class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold transition">Load Save</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 bg-blue-600 text-white rounded-full font-bold shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-center min-w-[200px]"></div>

    <script>
        // Sound Management
        const SoundManager = {
            ctx: null,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(type) {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                const pack = activeSoundPack || 'classic';

                if (pack === 'arcade') {
                    if (type === 'move') {
                        osc.type = 'square'; osc.frequency.setValueAtTime(440, now); osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
                        gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.start(now); osc.stop(now + 0.05);
                    } else if (type === 'capture') {
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                        gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now); osc.stop(now + 0.1);
                    } else if (type === 'check') {
                        osc.type = 'square'; osc.frequency.setValueAtTime(880, now); osc.frequency.setValueAtTime(1760, now + 0.05);
                        gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                        osc.start(now); osc.stop(now + 0.15);
                    }
                } else if (pack === 'wood') {
                    if (type === 'move') {
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); 
                        gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                        osc.start(now); osc.stop(now + 0.08);
                    } else if (type === 'capture') {
                        osc.type = 'sine'; osc.frequency.setValueAtTime(100, now); 
                        gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                        osc.start(now); osc.stop(now + 0.12);
                    } else if (type === 'check') {
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(400, now); 
                        gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                        osc.start(now); osc.stop(now + 0.2);
                    }
                } else {
                    if (type === 'move') {
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(350, now); osc.frequency.exponentialRampToValueAtTime(250, now + 0.1);
                        gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now); osc.stop(now + 0.1);
                    } else if (type === 'capture') {
                        osc.type = 'square'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                        gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                        osc.start(now); osc.stop(now + 0.15);
                    } else if (type === 'check') {
                        osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                        gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now); osc.stop(now + 0.2);
                    }
                }
            }
        };

        const STOCKFISH_URL = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
        
        const pieceSkins = [
            { id: 'wikipedia', name: 'Classic', cost: 0, url: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' },
            { id: 'alpha', name: 'Alpha', cost: 1000, url: 'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/{piece}.svg' },
            { id: 'cburnett', name: 'Lichess', cost: 2500, url: 'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett/{piece}.svg' },
            { id: 'pixel', name: 'Retro', cost: 10000, url: 'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/pixel/{piece}.svg' }
        ];

        const boardThemes = [
            { id: 'classic', name: 'Wood', cost: 0, class: '' },
            { id: 'forest', name: 'Forest', cost: 500, class: 'theme-forest' },
            { id: 'ocean', name: 'Ocean', cost: 1000, class: 'theme-ocean' },
            { id: 'dark', name: 'Dark', cost: 5000, class: 'theme-dark' }
        ];

        const soundPacks = [
            { id: 'classic', name: 'Classic', cost: 0 },
            { id: 'arcade', name: 'Arcade', cost: 750 },
            { id: 'wood', name: 'Thud', cost: 1500 }
        ];

        const levels = [];
        for (let i = 0; i <= 20.01; i += 0.1) {
            let name = i < 3 ? "Novice" : i < 7 ? "Beginner" : i < 12 ? "Intermediate" : i < 16 ? "Advanced" : i < 19 ? "Expert" : i < 20 ? "Master" : "Grandmaster";
            const idFixed = parseFloat(i.toFixed(1));
            levels.push({ id: idFixed, skill: Math.floor(i), name, elo: Math.round(500 + (idFixed * 125)) });
        }

        let coins = parseFloat(localStorage.getItem('sf_coins_v5')) || 0;
        let currentLevel = parseFloat(localStorage.getItem('sf_unlocked_level_v5')) || 0;
        let rebirths = parseInt(localStorage.getItem('sf_rebirths_v5')) || 1;
        let activeLevel = currentLevel;
        let ownedItems = JSON.parse(localStorage.getItem('sf_owned_items_v5')) || ['wikipedia', 'classic', 'classic'];
        let activeSkin = localStorage.getItem('sf_active_skin_v5') || 'wikipedia';
        let activeBoard = localStorage.getItem('sf_active_board_v5') || 'classic';
        let activeSoundPack = localStorage.getItem('sf_active_sounds_v5') || 'classic';

        let game = new Chess();
        let board = null;
        let stockfish = null;
        let playerColor = 'w';
        let pendingPromotion = null;

        function updateCoins(amt) {
            coins = parseFloat((coins + amt).toFixed(2));
            localStorage.setItem('sf_coins_v5', coins);
            $('#coin-display').text(Math.floor(coins).toLocaleString());
        }

        function switchTab(tab) {
            $('.border-blue-500').removeClass('border-blue-500 text-blue-400').addClass('border-transparent text-slate-400');
            $(`#tab-${tab}`).addClass('border-blue-500 text-blue-400').removeClass('border-transparent text-slate-400');
            if (tab === 'levels') {
                $('#content-levels').removeClass('hidden').addClass('flex');
                $('#content-shop').addClass('hidden').removeClass('flex');
            } else {
                $('#content-shop').removeClass('hidden').addClass('flex');
                $('#content-levels').addClass('hidden').removeClass('flex');
                renderShop();
            }
        }

        function renderShop() {
            const bShop = $('#board-shop').empty();
            const pShop = $('#piece-shop').empty();
            const sShop = $('#sound-shop').empty();
            $('#multi-display').text(`${rebirths}x Earnings`);

            boardThemes.forEach(t => {
                const owned = ownedItems.includes(t.id);
                const active = activeBoard === t.id;
                bShop.append(`
                    <button onclick="buyItem('${t.id}', 'board', ${t.cost})" class="p-2 text-[10px] rounded border transition ${active ? 'border-blue-500 bg-blue-900/20' : 'border-slate-700 bg-slate-700/50 hover:bg-slate-600'} flex flex-col items-center">
                        <span class="font-bold">${t.name}</span>
                        <span class="${owned ? 'text-emerald-400' : 'text-amber-400'}">${owned ? (active ? 'Active' : 'Equip') : '🪙 '+t.cost.toLocaleString()}</span>
                    </button>
                `);
            });

            pieceSkins.forEach(s => {
                const owned = ownedItems.includes(s.id);
                const active = activeSkin === s.id;
                pShop.append(`
                    <button onclick="buyItem('${s.id}', 'piece', ${s.cost})" class="p-2 text-[10px] rounded border transition ${active ? 'border-blue-500 bg-blue-900/20' : 'border-slate-700 bg-slate-700/50 hover:bg-slate-600'} flex flex-col items-center">
                        <span class="font-bold">${s.name}</span>
                        <span class="${owned ? 'text-emerald-400' : 'text-amber-400'}">${owned ? (active ? 'Active' : 'Equip') : '🪙 '+s.cost.toLocaleString()}</span>
                    </button>
                `);
            });

            soundPacks.forEach(sp => {
                const owned = ownedItems.includes(sp.id);
                const active = activeSoundPack === sp.id;
                sShop.append(`
                    <button onclick="buyItem('${sp.id}', 'sounds', ${sp.cost})" class="p-2 text-[10px] rounded border transition ${active ? 'border-blue-500 bg-blue-900/20' : 'border-slate-700 bg-slate-700/50 hover:bg-slate-600'} flex flex-col items-center">
                        <span class="font-bold">${sp.name}</span>
                        <span class="${owned ? 'text-emerald-400' : 'text-amber-400'}">${owned ? (active ? 'Active' : 'Equip') : '🪙 '+sp.cost.toLocaleString()}</span>
                    </button>
                `);
            });
        }

        function buyItem(id, type, cost) {
            if (ownedItems.includes(id)) {
                if (type === 'board') activeBoard = id;
                else if (type === 'piece') activeSkin = id;
                else activeSoundPack = id;
                showToast("Equipped!");
            } else {
                if (coins >= cost) {
                    updateCoins(-cost);
                    ownedItems.push(id);
                    localStorage.setItem('sf_owned_items_v5', JSON.stringify(ownedItems));
                    if (type === 'board') activeBoard = id;
                    else if (type === 'piece') activeSkin = id;
                    else activeSoundPack = id;
                    showToast("Purchased & Equipped!");
                } else {
                    showToast("Not enough coins!");
                    return;
                }
            }
            localStorage.setItem('sf_active_skin_v5', activeSkin);
            localStorage.setItem('sf_active_board_v5', activeBoard);
            localStorage.setItem('sf_active_sounds_v5', activeSoundPack);
            applyVisuals();
            renderShop();
        }

        function applyVisuals() {
            if (!board) return;
            const theme = boardThemes.find(t => t.id === activeBoard);
            $('#board').removeClass('theme-forest theme-ocean theme-dark').addClass(theme.class);
            const skin = pieceSkins.find(s => s.id === activeSkin);
            const config = {
                draggable: true,
                position: game.fen(),
                orientation: playerColor === 'w' ? 'white' : 'black',
                onDragStart: (s, p) => !game.game_over() && game.turn() === playerColor && p.startsWith(playerColor),
                onDrop: onDrop,
                onSnapEnd: () => board.position(game.fen()),
                pieceTheme: skin.url
            };
            board.destroy();
            board = Chessboard('board', config);
            updateCapturedPieces();
        }

        function initLevels() {
            const list = $('#level-list').empty();
            levels.forEach(lvl => {
                const isLocked = lvl.id > currentLevel;
                const isActive = Math.abs(lvl.id - activeLevel) < 0.01;
                list.append(`
                    <div class="level-card p-2 rounded-lg border transition ${isLocked ? 'locked' : 'hover:bg-slate-700 cursor-pointer'} ${isActive ? 'active' : 'bg-slate-700/50 border-transparent'}" 
                         onclick="selectLevel(${lvl.id})">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-[11px]">Level ${lvl.id.toFixed(1)}</span>
                            ${isLocked ? '<span class="text-[10px]">🔒</span>' : '<span class="text-[10px] text-emerald-400">✓</span>'}
                        </div>
                        <div class="flex justify-between items-center text-[9px] uppercase tracking-wider text-slate-400">
                            <span>ELO ${lvl.elo}</span>
                            <span class="text-amber-500">🪙 ${(lvl.id * rebirths).toFixed(1)}</span>
                        </div>
                    </div>
                `);
            });
            if (currentLevel >= 20) $('#rebirth-container').removeClass('hidden');
            $('#rebirth-desc').text(`Next Multiplier: ${rebirths + 1}x`);
        }

        function selectLevel(id) {
            if (id > currentLevel) return;
            activeLevel = id;
            updateLevelInfo();
            initLevels();
            resetGame();
        }

        function updateLevelInfo() {
            const lvl = levels.find(l => Math.abs(l.id - activeLevel) < 0.01);
            $('#current-level-title').text(`Level ${lvl.id.toFixed(1)}: ${lvl.name}`);
            $('#level-desc').text(`ELO: ${lvl.elo}`);
            $('#player-side-info').text(`Playing as ${playerColor === 'w' ? 'White' : 'Black'}`);
            const potentialReward = (activeLevel * rebirths).toFixed(1);
            $('#level-reward-tag').text(`Reward: ${potentialReward} Coins`);
        }

        function updateCapturedPieces() {
            const skin = pieceSkins.find(s => s.id === activeSkin);
            const initialPieces = { w: { p: 8, n: 2, b: 2, r: 2, q: 1 }, b: { p: 8, n: 2, b: 2, r: 2, q: 1 } };
            const currentPieces = { w: { p: 0, n: 0, b: 0, r: 0, q: 0 }, b: { p: 0, n: 0, b: 0, r: 0, q: 0 } };

            game.board().forEach(row => { row.forEach(square => { if (square) currentPieces[square.color][square.type]++; }); });
            const captured = { w: [], b: [] }; 
            const values = { p: 1, n: 3, b: 3, r: 5, q: 9 };
            let materialScore = 0;

            ['p','n','b','r','q'].forEach(type => {
                const whiteLost = initialPieces.w[type] - currentPieces.w[type];
                const blackLost = initialPieces.b[type] - currentPieces.b[type];
                for(let i=0; i<whiteLost; i++) captured.w.push(type);
                for(let i=0; i<blackLost; i++) captured.b.push(type);
                materialScore += (blackLost * values[type]) - (whiteLost * values[type]);
            });

            const wEl = $('#captures-white').empty();
            const bEl = $('#captures-black').empty();
            captured.w.forEach(type => {
                const url = skin.url.replace('{piece}', 'w' + type.toUpperCase());
                wEl.append(`<div class="captured-piece" style="background-image: url('${url}')"></div>`);
            });
            captured.b.forEach(type => {
                const url = skin.url.replace('{piece}', 'b' + type.toUpperCase());
                bEl.append(`<div class="captured-piece" style="background-image: url('${url}')"></div>`);
            });

            const advEl = $('#material-advantage');
            if (materialScore === 0) advEl.text('Even').css('color', '#64748b');
            else if (materialScore > 0) advEl.text(`+${materialScore}`).css('color', '#10b981');
            else advEl.text(`${materialScore}`).css('color', '#ef4444');
        }

        async function createStockfishWorker() {
            const blobCode = `importScripts("${STOCKFISH_URL}");`;
            const blob = new Blob([blobCode], { type: 'application/javascript' });
            return new Worker(URL.createObjectURL(blob));
        }

        async function initEngine() {
            if (stockfish) stockfish.terminate();
            stockfish = await createStockfishWorker();
            stockfish.onmessage = (e) => {
                const line = e.data;
                if (line.includes('score cp')) {
                    const scoreMatch = line.match(/score cp (-?\d+)/);
                    if (scoreMatch) {
                        let cp = parseInt(scoreMatch[1]);
                        if (game.turn() === 'b') cp = -cp;
                        updateEvalBar(cp);
                    }
                } else if (line.includes('bestmove')) {
                    const moveMatch = line.match(/bestmove\s([a-h][1-8][a-h][1-8][qrbn]?)/);
                    if (moveMatch && game.turn() !== playerColor) makeBotMove(moveMatch[1]);
                }
            };
            stockfish.postMessage('uci');
            const lvlObj = levels.find(l => Math.abs(l.id - activeLevel) < 0.01);
            stockfish.postMessage(`setoption name Skill Level value ${lvlObj.skill}`);
            stockfish.postMessage('isready');
        }

        function updateEvalBar(score) {
            const evalInPawns = score / 100;
            const displayStr = evalInPawns > 0 ? `+${evalInPawns.toFixed(1)}` : evalInPawns.toFixed(1);
            
            let percentage = 50 + (evalInPawns * 5); 
            percentage = Math.max(5, Math.min(95, percentage));
            
            $('#eval-bar-white').css('height', `${percentage}%`);
            $('#eval-text').text(displayStr);

            // Shift text location and color based on which side is "bigger"
            if (percentage > 50) {
                $('#eval-text').removeClass('on-black').addClass('on-white');
            } else {
                $('#eval-text').removeClass('on-white').addClass('on-black');
            }
        }

        function makeBotMove(moveStr) {
            const move = game.move(moveStr, { sloppy: true });
            board.position(game.fen());
            handleSounds(move);
            updateStatus();
        }

        function handleSounds(move) {
            if (game.in_check()) SoundManager.play('check');
            else if (move && (move.flags.includes('c') || move.flags.includes('e'))) SoundManager.play('capture');
            else SoundManager.play('move');
        }

        function onDrop(source, target) {
            const piece = game.get(source);
            if (!piece) return 'snapback';
            const isPromotion = piece.type === 'p' && ((piece.color === 'w' && target[1] === '8') || (piece.color === 'b' && target[1] === '1'));
            
            if (isPromotion) {
                const moves = game.moves({ verbose: true });
                const valid = moves.some(m => m.from === source && m.to === target);
                if (!valid) return 'snapback';
                showPromotionModal(source, target);
                return;
            }

            const move = game.move({ from: source, to: target });
            if (!move) return 'snapback';
            handleSounds(move);
            updateStatus();
            if (!game.game_over()) setTimeout(() => {
                stockfish.postMessage(`position fen ${game.fen()}`);
                stockfish.postMessage(`go movetime ${100 + (activeLevel * 50)}`);
            }, 250);
        }

        function showPromotionModal(from, to) {
            pendingPromotion = { from, to };
            const options = $('#promotion-options').empty();
            const skin = pieceSkins.find(s => s.id === activeSkin);
            const pieces = [{ type: 'q', name: 'Queen' }, { type: 'r', name: 'Rook' }, { type: 'b', name: 'Bishop' }, { type: 'n', name: 'Knight' }];
            pieces.forEach(p => {
                const url = skin.url.replace('{piece}', playerColor + p.type.toUpperCase());
                options.append(`<button onclick="handlePromotion('${p.type}')" class="p-4 bg-slate-700 hover:bg-blue-600 rounded-xl transition flex flex-col items-center gap-2 group"><img src="${url}" class="w-12 h-12 group-hover:scale-110 transition"><span class="text-xs font-bold uppercase">${p.name}</span></button>`);
            });
            $('#promotion-modal').removeClass('hidden');
        }

        function handlePromotion(pieceType) {
            const move = game.move({ from: pendingPromotion.from, to: pendingPromotion.to, promotion: pieceType });
            $('#promotion-modal').addClass('hidden');
            board.position(game.fen());
            handleSounds(move);
            updateStatus();
            setTimeout(() => {
                stockfish.postMessage(`position fen ${game.fen()}`);
                stockfish.postMessage(`go movetime ${100 + (activeLevel * 50)}`);
            }, 250);
        }

        function updateStatus() {
            const isPlayerTurn = game.turn() === playerColor;
            let status = game.in_checkmate() ? 'Checkmate!' : game.in_draw() ? 'Draw' : (isPlayerTurn ? "Your Turn" : "Thinking...");
            $('#game-status').text(status);
            updateCapturedPieces();
            if (game.game_over()) handleGameOver();
        }

        function handleGameOver() {
            const winner = game.in_checkmate() ? (game.turn() === 'b' ? 'white' : 'black') : 'draw';
            const playerWon = (winner === 'white' && playerColor === 'w') || (winner === 'black' && playerColor === 'b');
            $('#game-over-modal').removeClass('hidden');
            const coinGain = activeLevel * rebirths;
            if (playerWon) {
                $('#modal-title').text('Victory!').addClass('text-emerald-400');
                updateCoins(coinGain);
                $('#modal-reward').text(`+ ${coinGain.toFixed(1)} Coins`);
                if (Math.abs(activeLevel - currentLevel) < 0.01 && currentLevel < 20) {
                    currentLevel = parseFloat((currentLevel + 0.1).toFixed(1));
                    localStorage.setItem('sf_unlocked_level_v5', currentLevel);
                    $('#modal-msg').text(`Unlocked Level ${currentLevel.toFixed(1)}!`);
                    initLevels();
                } else $('#modal-msg').text(`Level ${activeLevel.toFixed(1)} Mastered!`);
            } else if (winner === 'draw') {
                $('#modal-title').text('Draw').removeClass('text-emerald-400');
                $('#modal-msg').text('Close match.');
            } else {
                $('#modal-title').text('Defeated').addClass('text-red-400').removeClass('text-emerald-400');
                $('#modal-msg').text('Stockfish prevails.');
            }
        }

        function closeModal() { $('#game-over-modal').addClass('hidden'); resetGame(); }

        async function resetGame() {
            game = new Chess();
            playerColor = Math.random() < 0.5 ? 'w' : 'b';
            if (board) { board.orientation(playerColor === 'w' ? 'white' : 'black'); board.start(); }
            updateLevelInfo();
            updateEvalBar(0);
            updateCapturedPieces();
            await initEngine();
            updateStatus();
            if (playerColor === 'b') {
                stockfish.postMessage(`position fen ${game.fen()}`);
                stockfish.postMessage(`go movetime 500`);
            }
        }

        function showToast(msg) {
            $('#toast').text(msg).css('opacity', 1);
            setTimeout(() => $('#toast').css('opacity', 0), 3000);
        }

        $(document).ready(async () => {
            const skin = pieceSkins.find(s => s.id === activeSkin);
            board = Chessboard('board', {
                draggable: true, position: 'start',
                onDragStart: (s, p) => !game.game_over() && game.turn() === playerColor && p.startsWith(playerColor),
                onDrop: onDrop,
                onSnapEnd: () => board.position(game.fen()),
                pieceTheme: skin.url
            });
            $('#reset-btn').on('click', resetGame);
            $('#undo-btn').on('click', () => { game.undo(); game.undo(); board.position(game.fen()); updateStatus(); });
            $('#rebirth-btn').on('click', () => {
                rebirths++;
                localStorage.setItem('sf_rebirths_v5', rebirths);
                currentLevel = 0; activeLevel = 0;
                localStorage.setItem('sf_unlocked_level_v5', currentLevel);
                location.reload();
            });
            $('#save-btn').on('click', () => {
                const data = btoa(JSON.stringify({ u: currentLevel, coins, r: rebirths, items: ownedItems, s: activeSkin, b: activeBoard, snd: activeSoundPack }));
                const el = document.createElement('textarea'); el.value = "SFM-V5-" + data;
                document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
                showToast("Save Code Copied!");
            });
            $('#load-btn').on('click', () => $('#load-prompt-modal').removeClass('hidden'));
            $('#confirm-load-btn').on('click', () => {
                try {
                    const code = $('#save-code-input').val().trim().replace("SFM-V5-", "");
                    const data = JSON.parse(atob(code));
                    localStorage.setItem('sf_unlocked_level_v5', data.u);
                    localStorage.setItem('sf_coins_v5', data.coins);
                    localStorage.setItem('sf_rebirths_v5', data.r);
                    localStorage.setItem('sf_owned_items_v5', JSON.stringify(data.items));
                    localStorage.setItem('sf_active_skin_v5', data.s);
                    localStorage.setItem('sf_active_board_v5', data.b);
                    localStorage.setItem('sf_active_sounds_v5', data.snd);
                    location.reload();
                } catch(e) { showToast("Invalid Code!"); }
            });
            const theme = boardThemes.find(t => t.id === activeBoard);
            $('#board').addClass(theme.class);
            updateCoins(0);
            initLevels();
            await resetGame();
            $(window).resize(() => board && board.resize());
        });
    </script>
</body>
</html>

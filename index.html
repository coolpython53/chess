<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockfish Mastery - Unlock the Grandmaster</title>
    <!-- Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .level-card.locked { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }
        .level-card.active { border: 2px solid #3b82f6; background: rgba(59, 130, 246, 0.2); }
        #board-container { display: flex; gap: 15px; width: 100%; max-width: 580px; margin: 0 auto; align-items: stretch; }
        #board { flex-grow: 1; }
        
        #eval-bar-container {
            width: 36px;
            background: #000000;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
            position: relative;
            border: 2px solid #0f172a;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        #eval-bar-white { 
            background: #ffffff;
            width: 100%; 
            height: 50%; 
            transition: height 0.6s cubic-bezier(0.23, 1, 0.32, 1); 
        }
        #eval-text {
            position: absolute; 
            width: 100%; 
            text-align: center; 
            font-size: 11px;
            font-weight: 900; 
            z-index: 10; 
            left: 0; 
            pointer-events: none;
        }
        #eval-text.on-white { bottom: 8px; color: #000; }
        #eval-text.on-black { top: 8px; color: #fff; }

        .chessboard-63fde { border: 4px solid #334155 !important; border-radius: 4px; overflow: hidden; }
        
        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        .theme-forest .white-1e1d7 { background-color: #edead0 !important; }
        .theme-forest .black-3c85d { background-color: #6c9463 !important; }
        .theme-ocean .white-1e1d7 { background-color: #dee3e6 !important; }
        .theme-ocean .black-3c85d { background-color: #8ca2ad !important; }
        .theme-dark .white-1e1d7 { background-color: #9e9e9e !important; }
        .theme-dark .black-3c85d { background-color: #424242 !important; }

        .captured-piece { width: 22px; height: 22px; background-size: contain; background-repeat: no-repeat; display: inline-block; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }
        
        .move-item { cursor: pointer; padding: 2px 4px; border-radius: 4px; }
        .move-item:hover { background: rgba(255,255,255,0.1); }
        .move-item.active { background: #3b82f6; color: white; }

        #copy-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col lg:flex-row p-4 gap-4 font-sans overflow-x-hidden">

    <div id="copy-toast">Moves copied to clipboard!</div>

    <!-- Left Sidebar: Levels & Shop -->
    <div class="w-full lg:w-72 flex flex-col gap-4 bg-slate-800 p-4 rounded-xl shadow-2xl h-[90vh]">
        <div class="flex flex-col gap-2 border-b border-slate-700 pb-4">
            <div class="flex justify-between items-center mb-1">
                <h1 class="text-lg font-bold">Stockfish Mastery</h1>
                <div class="bg-amber-500/20 text-amber-400 px-2 py-1 rounded text-xs font-mono flex items-center gap-1">
                    🪙 <span id="coin-display">0</span>
                </div>
            </div>
            <div class="flex gap-1">
                <button id="save-btn" class="flex-1 py-1 text-[9px] bg-slate-700 hover:bg-slate-600 rounded transition uppercase font-bold">Export</button>
                <button id="load-btn" class="flex-1 py-1 text-[9px] bg-slate-700 hover:bg-slate-600 rounded transition uppercase font-bold">Import</button>
            </div>
        </div>

        <div class="flex border-b border-slate-700">
            <button onclick="switchTab('levels')" id="tab-levels" class="flex-1 py-2 text-xs font-bold border-b-2 border-blue-500 text-blue-400">Levels</button>
            <button onclick="switchTab('shop')" id="tab-shop" class="flex-1 py-2 text-xs font-bold border-b-2 border-transparent text-slate-400">Shop</button>
        </div>

        <div id="content-levels" class="flex-col gap-2 overflow-y-auto flex-grow pr-1 custom-scroll">
            <div id="level-list" class="flex flex-col gap-2"></div>
        </div>

        <div id="content-shop" class="hidden flex-col gap-4 overflow-y-auto flex-grow pr-1 custom-scroll">
            <div id="board-shop" class="grid grid-cols-2 gap-2 mt-2"></div>
            <div id="piece-shop" class="grid grid-cols-2 gap-2"></div>
        </div>
    </div>

    <!-- Middle: Game Board -->
    <div class="flex-1 flex flex-col items-center justify-start gap-4">
        <div class="bg-slate-800 p-4 lg:p-6 rounded-2xl shadow-2xl w-full max-w-2xl">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h2 id="current-level-title" class="text-md font-bold text-blue-400">Level 0</h2>
                    <p id="player-side-info" class="text-[10px] font-bold uppercase tracking-widest text-slate-400">White</p>
                </div>
                <div class="flex flex-col items-end gap-2">
                    <div id="game-status" class="text-[10px] px-3 py-1 bg-slate-700 rounded-full font-bold uppercase">Ready</div>
                    <div class="flex gap-1">
                        <button id="mode-play" onclick="setMode('play')" class="px-3 py-1 text-[10px] font-bold rounded bg-blue-600 text-white">PLAY</button>
                        <button id="mode-analyze" onclick="setMode('analyze')" class="px-3 py-1 text-[10px] font-bold rounded bg-slate-700 text-slate-300">ANALYZE</button>
                    </div>
                </div>
            </div>

            <div id="board-container">
                <div id="eval-bar-container">
                    <div id="eval-text" class="on-black">0.0</div>
                    <div id="eval-bar-white"></div>
                </div>
                <div id="board"></div>
            </div>

            <div class="mt-4 flex gap-2 justify-center">
                <button id="reset-btn" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold transition">NEW GAME</button>
                <button id="copy-moves-btn" class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-bold transition">COPY MOVES</button>
                <button id="flip-btn" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold transition">FLIP</button>
            </div>
        </div>
    </div>

    <!-- Right Sidebar: History & Analysis -->
    <div class="w-full lg:w-64 flex flex-col gap-4 bg-slate-800 p-4 rounded-xl shadow-2xl h-[90vh]">
        <h3 class="text-xs font-bold uppercase text-slate-400 border-b border-slate-700 pb-2">Move History</h3>
        
        <div id="move-history-list" class="flex-grow overflow-y-auto custom-scroll text-sm font-mono grid grid-cols-2 gap-x-2 gap-y-1 content-start">
            <!-- Moves injected here -->
        </div>

        <div class="border-t border-slate-700 pt-4 flex flex-col gap-2">
            <button id="import-pgn-btn" class="w-full py-2 bg-slate-700 hover:bg-slate-600 rounded text-[10px] font-bold uppercase transition">Import PGN/Moves</button>
            <p class="text-[9px] text-slate-500 text-center italic">Use Arrow Keys ← → to navigate moves in Analyze Mode</p>
        </div>
    </div>

    <!-- Modals -->
    <div id="pgn-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100] p-4">
        <div class="bg-slate-800 p-6 rounded-2xl w-full max-w-md border border-slate-700">
            <h2 class="text-xl font-bold mb-2 text-blue-400">Load Game</h2>
            <p class="text-[10px] text-slate-400 mb-4 uppercase font-bold">Paste moves (e.g. e4 e5 Nf3...) or a PGN string</p>
            <textarea id="pgn-input" class="w-full h-40 bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs mb-4 font-mono text-slate-300 focus:outline-none focus:border-blue-500" placeholder="1. e4 e5 2. Nf3 Nc6..."></textarea>
            <div class="flex gap-2">
                <button onclick="$('#pgn-modal').addClass('hidden')" class="flex-1 py-2 bg-slate-700 rounded font-bold text-xs">CANCEL</button>
                <button id="confirm-pgn-load" class="flex-1 py-2 bg-blue-600 rounded font-bold text-xs">LOAD GAME</button>
            </div>
        </div>
    </div>

    <div id="game-over-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 p-8 rounded-2xl text-center max-w-sm border border-slate-600">
            <h2 id="modal-title" class="text-3xl font-bold mb-2">You Won!</h2>
            <div id="modal-reward" class="text-amber-400 font-bold text-xl mb-4"></div>
            <p id="modal-msg" class="text-slate-300 mb-6"></p>
            <button onclick="$('#game-over-modal').addClass('hidden'); resetGame();" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold transition">Continue</button>
        </div>
    </div>

    <script>
        const STOCKFISH_URL = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
        
        // Game State
        let game = new Chess();
        let board = null;
        let stockfish = null;
        let playerColor = 'w';
        let currentMode = 'play'; 
        let historyIndex = -1; 
        let moveHistory = []; 

        // Persistence
        let coins = parseFloat(localStorage.getItem('sf_coins_v6')) || 0;
        let currentLevel = parseFloat(localStorage.getItem('sf_unlocked_v6')) || 0;
        let activeLevel = currentLevel;
        let rebirths = parseInt(localStorage.getItem('sf_rebirths_v6')) || 1;
        let ownedItems = JSON.parse(localStorage.getItem('sf_owned_v6')) || ['wikipedia', 'classic'];
        let activeSkin = localStorage.getItem('sf_skin_v6') || 'wikipedia';
        let activeBoard = localStorage.getItem('sf_board_v6') || 'classic';

        const pieceSkins = [
            { id: 'wikipedia', name: 'Classic', url: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' },
            { id: 'alpha', name: 'Alpha', url: 'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/{piece}.svg' },
            { id: 'cburnett', name: 'Lichess', url: 'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett/{piece}.svg' }
        ];

        const boardThemes = [
            { id: 'classic', name: 'Wood', class: '' },
            { id: 'forest', name: 'Forest', class: 'theme-forest' },
            { id: 'ocean', name: 'Ocean', class: 'theme-ocean' },
            { id: 'dark', name: 'Dark', class: 'theme-dark' }
        ];

        const levels = [];
        for (let i = 0; i <= 20.01; i += 0.5) {
            levels.push({ id: i, skill: Math.floor(i), elo: Math.round(500 + (i * 125)) });
        }

        function updateCoins(amt) {
            coins = parseFloat((coins + amt).toFixed(2));
            localStorage.setItem('sf_coins_v6', coins);
            $('#coin-display').text(Math.floor(coins).toLocaleString());
        }

        function setMode(mode) {
            currentMode = mode;
            if (mode === 'play') {
                $('#mode-play').addClass('bg-blue-600 text-white').removeClass('bg-slate-700 text-slate-300');
                $('#mode-analyze').removeClass('bg-blue-600 text-white').addClass('bg-slate-700 text-slate-300');
                if (game.turn() !== playerColor && !game.game_over()) triggerEngine();
            } else {
                $('#mode-analyze').addClass('bg-blue-600 text-white').removeClass('bg-slate-700 text-slate-300');
                $('#mode-play').removeClass('bg-blue-600 text-white').addClass('bg-slate-700 text-slate-300');
            }
        }

        function switchTab(tab) {
            $('.border-blue-500').removeClass('border-blue-500 text-blue-400').addClass('border-transparent text-slate-400');
            $(`#tab-${tab}`).addClass('border-blue-500 text-blue-400').removeClass('border-transparent text-slate-400');
            if (tab === 'levels') {
                $('#content-levels').removeClass('hidden').addClass('flex');
                $('#content-shop').addClass('hidden').removeClass('flex');
            } else {
                $('#content-levels').addClass('hidden').removeClass('flex');
                $('#content-shop').removeClass('hidden').addClass('flex');
                renderShop();
            }
        }

        function renderShop() {
            const bShop = $('#board-shop').empty();
            const pShop = $('#piece-shop').empty();
            boardThemes.forEach(t => {
                const active = activeBoard === t.id;
                bShop.append(`<button onclick="equip('board', '${t.id}')" class="p-2 text-[10px] rounded border ${active ? 'border-blue-500 bg-blue-900/20' : 'border-slate-700'}">${t.name}</button>`);
            });
            pieceSkins.forEach(s => {
                const active = activeSkin === s.id;
                pShop.append(`<button onclick="equip('piece', '${s.id}')" class="p-2 text-[10px] rounded border ${active ? 'border-blue-500 bg-blue-900/20' : 'border-slate-700'}">${s.name}</button>`);
            });
        }

        function equip(type, id) {
            if (type === 'board') activeBoard = id;
            else activeSkin = id;
            localStorage.setItem('sf_board_v6', activeBoard);
            localStorage.setItem('sf_skin_v6', activeSkin);
            applyVisuals();
            renderShop();
        }

        function applyVisuals() {
            const theme = boardThemes.find(t => t.id === activeBoard);
            const skin = pieceSkins.find(s => s.id === activeSkin);
            $('#board').removeClass('theme-forest theme-ocean theme-dark').addClass(theme.class);
            
            const config = {
                draggable: true,
                position: game.fen(),
                orientation: board ? board.orientation() : (playerColor === 'w' ? 'white' : 'black'),
                onDragStart: (s, p) => !game.game_over() && (currentMode === 'analyze' || game.turn() === playerColor),
                onDrop: onDrop,
                onSnapEnd: () => board.position(game.fen()),
                pieceTheme: skin.url
            };
            if (board) board.destroy();
            board = Chessboard('board', config);
        }

        function initLevels() {
            const list = $('#level-list').empty();
            levels.forEach(lvl => {
                const isLocked = lvl.id > currentLevel;
                const isActive = Math.abs(lvl.id - activeLevel) < 0.01;
                list.append(`
                    <div onclick="selectLevel(${lvl.id})" class="level-card p-2 rounded border transition ${isLocked ? 'locked' : 'cursor-pointer'} ${isActive ? 'active' : 'bg-slate-700/50 border-transparent'}">
                        <div class="flex justify-between text-[10px] font-bold">
                            <span>Level ${lvl.id.toFixed(1)}</span>
                            <span>ELO ${lvl.elo}</span>
                        </div>
                    </div>
                `);
            });
        }

        function selectLevel(id) {
            if (id > currentLevel) return;
            activeLevel = id;
            initLevels();
            resetGame();
        }

        async function initEngine() {
            if (stockfish) stockfish.terminate();
            const blob = new Blob([`importScripts("${STOCKFISH_URL}");`], { type: 'application/javascript' });
            stockfish = new Worker(URL.createObjectURL(blob));
            stockfish.onmessage = (e) => {
                const line = e.data;
                if (line.includes('score cp')) {
                    const match = line.match(/score cp (-?\d+)/);
                    if (match) updateEvalBar(parseInt(match[1]) * (game.turn() === 'b' ? -1 : 1));
                } else if (line.includes('bestmove')) {
                    const match = line.match(/bestmove\s([a-h][1-8][a-h][1-8][qrbn]?)/);
                    if (match && currentMode === 'play' && game.turn() !== playerColor) {
                        const move = game.move(match[1], { sloppy: true });
                        recordMove(move);
                        board.position(game.fen());
                        updateStatus();
                    }
                }
            };
            stockfish.postMessage('uci');
            stockfish.postMessage(`setoption name Skill Level value ${Math.floor(activeLevel)}`);
        }

        function updateEvalBar(score) {
            const val = Math.max(-10, Math.min(10, score / 100));
            const pct = 50 + (val * 5);
            $('#eval-bar-white').css('height', `${pct}%`);
            $('#eval-text').text((score/100).toFixed(1)).toggleClass('on-white', pct > 50).toggleClass('on-black', pct <= 50);
        }

        function recordMove(move) {
            if (!move) return;
            if (historyIndex < moveHistory.length - 1) {
                moveHistory = moveHistory.slice(0, historyIndex + 1);
            }
            moveHistory.push({
                fen: game.fen(),
                san: move.san
            });
            historyIndex = moveHistory.length - 1;
            renderHistory();
        }

        function renderHistory() {
            const list = $('#move-history-list').empty();
            moveHistory.forEach((item, i) => {
                const isWhite = i % 2 === 0;
                const turnNum = Math.floor(i / 2) + 1;
                if (isWhite) {
                    list.append(`<div class="text-slate-500 text-[10px] col-span-2 mt-1">Move ${turnNum}</div>`);
                }
                const active = i === historyIndex ? 'active' : '';
                list.append(`<div onclick="goToMove(${i})" class="move-item ${active}">${item.san}</div>`);
            });
            const container = document.getElementById('move-history-list');
            container.scrollTop = container.scrollHeight;
        }

        function goToMove(index) {
            if (index < -1 || index >= moveHistory.length) return;
            historyIndex = index;
            const fen = index === -1 ? 'start' : moveHistory[index].fen;
            game.load(fen === 'start' ? 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1' : fen);
            board.position(game.fen());
            renderHistory();
            updateStatus();
        }

        function onDrop(source, target) {
            const move = game.move({ from: source, to: target, promotion: 'q' });
            if (!move) return 'snapback';
            
            recordMove(move);
            updateStatus();
            
            if (currentMode === 'play' && !game.game_over()) {
                setTimeout(triggerEngine, 250);
            }
        }

        function triggerEngine() {
            if (currentMode !== 'play' || game.game_over()) return;
            stockfish.postMessage(`position fen ${game.fen()}`);
            stockfish.postMessage(`go movetime ${100 + (activeLevel * 50)}`);
        }

        function updateStatus() {
            let status = game.in_checkmate() ? 'Checkmate!' : game.in_draw() ? 'Draw' : (game.turn() === 'w' ? "White's Turn" : "Black's Turn");
            $('#game-status').text(status);
            $('#current-level-title').text(`Level ${activeLevel.toFixed(1)}`);
            $('#player-side-info').text(`Playing as ${playerColor === 'w' ? 'White' : 'Black'}`);
            
            if (game.game_over() && currentMode === 'play') handleGameOver();
            
            if (currentMode === 'analyze') {
                stockfish.postMessage(`position fen ${game.fen()}`);
                stockfish.postMessage(`go depth 10`);
            }
        }

        function handleGameOver() {
            const winner = game.in_checkmate() ? (game.turn() === 'b' ? 'white' : 'black') : 'draw';
            const playerWon = (winner === 'white' && playerColor === 'w') || (winner === 'black' && playerColor === 'b');
            $('#game-over-modal').removeClass('hidden');
            const reward = activeLevel * rebirths;
            if (playerWon) {
                updateCoins(reward);
                $('#modal-title').text('Victory!').addClass('text-emerald-400');
                $('#modal-reward').text(`+ ${reward.toFixed(1)} Coins`);
                if (activeLevel >= currentLevel && currentLevel < 20) {
                    currentLevel = parseFloat((currentLevel + 0.5).toFixed(1));
                    localStorage.setItem('sf_unlocked_v6', currentLevel);
                }
            } else {
                $('#modal-title').text(winner === 'draw' ? 'Draw' : 'Defeat').removeClass('text-emerald-400');
                $('#modal-reward').text('');
            }
        }

        async function resetGame() {
            game = new Chess();
            moveHistory = [];
            historyIndex = -1;
            playerColor = Math.random() < 0.5 ? 'w' : 'b';
            board.orientation(playerColor === 'w' ? 'white' : 'black');
            board.start();
            renderHistory();
            updateEvalBar(0);
            await initEngine();
            updateStatus();
            if (playerColor === 'b' && currentMode === 'play') triggerEngine();
        }

        function copyMovesToClipboard() {
            const moveList = moveHistory.map(m => m.san).join(' ');
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = moveList;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);
            
            const toast = document.getElementById('copy-toast');
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        }

        $(document).keydown((e) => {
            if ($('#pgn-modal').is(':visible')) return;
            if (e.keyCode === 37) { 
                goToMove(historyIndex - 1);
            } else if (e.keyCode === 39) { 
                goToMove(historyIndex + 1);
            }
        });

        $(document).ready(async () => {
            applyVisuals();
            initLevels();
            updateCoins(0);

            $('#reset-btn').click(resetGame);
            $('#copy-moves-btn').click(copyMovesToClipboard);
            $('#flip-btn').click(() => board.flip());
            
            $('#import-pgn-btn').click(() => $('#pgn-modal').removeClass('hidden'));
            $('#confirm-pgn-load').click(() => {
                const input = $('#pgn-input').val().trim();
                if (!input) return;
                const tempGame = new Chess();
                const success = tempGame.load_pgn(input) || (function(){
                    const moves = input.split(/\s+/);
                    for(let m of moves) if(!tempGame.move(m, {sloppy:true})) return false;
                    return true;
                })();

                if (success) {
                    game = new Chess();
                    moveHistory = [];
                    const moves = tempGame.history();
                    moves.forEach(m => {
                        const mv = game.move(m);
                        moveHistory.push({ fen: game.fen(), san: mv.san });
                    });
                    historyIndex = moveHistory.length - 1;
                    setMode('analyze');
                    renderHistory();
                    board.position(game.fen());
                    $('#pgn-modal').addClass('hidden');
                    updateStatus();
                } else {
                    alert("Invalid Moves or PGN Format");
                }
            });

            await resetGame();
            $(window).resize(() => board && board.resize());
        });
    </script>
</body>
</html>
